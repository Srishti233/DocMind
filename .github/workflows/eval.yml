name: eval
# Manual only: Actions tab -> "eval" -> Run workflow.
# Runs the REAL retrieval evaluation (downloads the embedding/BM25/reranker models from
# Hugging Face onto the runner). No Ollama is needed. Results appear in the job summary
# and as the downloadable "eval-results" artifact.
on:
  workflow_dispatch:

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m eval.run_eval --data-dir "$RUNNER_TEMP/evaldata" --out eval/results.md
      - run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.md
